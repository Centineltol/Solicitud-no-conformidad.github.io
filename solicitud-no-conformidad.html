<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>Solicitud de No Conformidad</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root {
    --navy: #0F2540;
    --navy-2: #16345C;
    --steel: #3D5A80;
    --amber: #C1440E;
    --amber-2: #E0611A;

    --paper: #F4F2EC;
    --card: #FFFFFF;

    --ink: #1A2332;
    --muted: #5C6B7A;
    --line: #D8D3C6;

    --ok: #2E7D4F;
    --radius: 4px;
}

* {
    box-sizing: border-box;
}

html {
    width: 100%;
}

body {
    margin: 0;

    /* Fondo sólido, sin cuadrícula */
    background: var(--paper);

    font-family: "IBM Plex Sans", "Segoe UI", Arial, sans-serif;
    color: var(--ink);

    min-height: 100vh;
    padding: 28px 18px 60px;
}

.wrap {
    width: 100%;
    max-width: 1180px;
    margin: 0 auto;
}

/* =====================================================
   DOCUMENTO
===================================================== */

.doc {
    position: relative;

    background: var(--card);

    border: 1px solid var(--line);
    border-top: 7px solid var(--navy);

    box-shadow:
        0 2px 5px rgba(15,37,64,.05),
        0 15px 35px -22px rgba(15,37,64,.35);
}

/* =====================================================
   HEADER
===================================================== */

.doc-head {
    display: grid;

    /*
        Logo | Información | Folio

        minmax(0,1fr) evita que el título empuje
        el folio fuera de la pantalla.
    */
    grid-template-columns: auto minmax(0, 1fr) auto;

    align-items: center;
    gap: 28px;

    padding: 22px 30px;

    border-bottom: 1px dashed var(--line);
}

.logo-box {
    display: flex;
    align-items: center;
    justify-content: center;

    flex-shrink: 0;

    padding-right: 26px;

    border-right: 1px solid var(--line);
}

.company-logo {
    display: block;

    width: clamp(125px, 14vw, 175px);
    max-height: 95px;

    object-fit: contain;
}

.head-copy {
    min-width: 0;
}

.eyebrow {
    margin: 0 0 7px;

    font-family: "IBM Plex Mono", monospace;

    font-size: 11px;
    font-weight: 700;

    letter-spacing: .15em;

    text-transform: uppercase;

    color: var(--amber);
}

h1 {
    margin: 0;

    font-size: clamp(22px, 2.6vw, 33px);

    line-height: 1.15;

    font-weight: 700;

    letter-spacing: -.025em;

    color: var(--navy);
}

.sub {
    margin: 8px 0 0;

    font-size: 14px;
    line-height: 1.5;

    color: var(--muted);
}

/* =====================================================
   FOLIO

   min-width evita que el número se corte.
   white-space evita salto de línea dentro del folio.
===================================================== */

.folio-tab {
    flex-shrink: 0;

    min-width: 190px;

    padding: 13px 18px;

    text-align: left;

    background: #0d7c2d;
    color: white;

    border-radius: 7px;

    overflow: visible;
}

.folio-label {
    display: block;

    margin-bottom: 4px;

    font-family: "IBM Plex Mono", monospace;

    font-size: 10px;

    letter-spacing: .14em;

    text-transform: uppercase;

    opacity: .7;
}

.folio-num {
    display: block;

    font-family: "IBM Plex Mono", monospace;

    font-size: clamp(17px, 1.7vw, 22px);
    font-weight: 700;

    letter-spacing: .02em;

    white-space: nowrap;

    overflow: visible;
}

/* =====================================================
   FORMULARIO
===================================================== */

form {
    padding: 26px 30px 32px;
}

.field {
    margin-bottom: 21px;
}

.field label {
    display: block;

    margin-bottom: 7px;

    font-size: 13px;
    font-weight: 600;

    color: var(--navy-2);
}

.field .num {
    display: inline-block;

    margin-right: 7px;

    font-family: "IBM Plex Mono", monospace;
    font-weight: 700;

    color: var(--amber);
}

.required-mark {
    color: var(--amber);
}

.hint {
    margin: 5px 0 0;

    font-size: 11.5px;

    color: var(--muted);
}

input[type="text"],
input[type="date"],
select,
textarea {
    width: 100%;

    padding: 11px 12px;

    font-family: inherit;

    font-size: 14px;

    color: var(--ink);

    background: #FCFBF8;

    border: 1px solid var(--line);

    border-radius: var(--radius);

    outline: none;

    transition:
        border-color .15s,
        box-shadow .15s,
        background .15s;
}

input:focus,
select:focus,
textarea:focus {
    border-color: var(--steel);

    background: #fff;

    box-shadow:
        0 0 0 3px rgba(61,90,128,.15);
}

input:disabled {
    color: #60748C;

    background: #F1F3F5;

    cursor: not-allowed;
}

textarea {
    min-height: 120px;

    resize: vertical;

    line-height: 1.5;
}

/* =====================================================
   GRIDS
===================================================== */

.grid2 {
    display: grid;

    grid-template-columns: repeat(2, minmax(0, 1fr));

    gap: 22px;
}

/* =====================================================
   TIPO DE NO CONFORMIDAD
===================================================== */

.type-options {
    display: grid;

    grid-template-columns: repeat(4, minmax(0, 1fr));

    gap: 9px;
}

.type-opt {
    position: relative;

    min-width: 0;
}

.type-opt input {
    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    margin: 0;

    opacity: 0;

    cursor: pointer;
}

.type-opt span {
    display: flex;

    align-items: center;
    justify-content: center;

    min-height: 44px;

    padding: 9px;

    text-align: center;

    font-size: 12.5px;
    font-weight: 600;

    line-height: 1.2;

    color: var(--navy-2);

    background: #FCFBF8;

    border: 1px solid var(--line);

    border-radius: var(--radius);

    transition: .15s;
}

.type-opt input:checked + span {
    color: white;

    background: var(--navy);

    border-color: var(--navy);
}

.type-opt input:focus-visible + span {
    box-shadow:
        0 0 0 3px rgba(61,90,128,.35);
}

/* =====================================================
   BOTONES
===================================================== */

.actions {
    display: flex;

    justify-content: flex-end;

    gap: 12px;

    margin-top: 4px;

    padding-top: 16px;

    border-top: 1px dashed var(--line);
}

button {
    min-height: 43px;

    padding: 10px 22px;

    font-family: inherit;

    font-size: 13.5px;
    font-weight: 600;

    border-radius: var(--radius);

    border: 1px solid transparent;

    cursor: pointer;

    transition: .15s;
}

button:disabled {
    opacity: .6;

    cursor: wait;
}

.btn-primary {
    min-width: 165px;

    background: var(--amber);

    color: white;
}

.btn-primary:hover {
    background: var(--amber-2);
}

.btn-ghost {
    min-width: 120px;

    background: transparent;

    color: var(--navy-2);

    border-color: var(--steel);
}

.btn-ghost:hover {
    background: #F1EEE5;
}

/* =====================================================
   TOAST
===================================================== */

.toast {
    display: none;

    align-items: center;

    gap: 10px;

    margin: 20px 30px 0;

    padding: 12px 16px;

    background: #EAF4EE;

    border: 1px solid #BFE0CB;

    border-radius: var(--radius);

    color: var(--ok);

    font-size: 13.5px;
    font-weight: 600;
}

.toast.show {
    display: flex;
}

/* =====================================================
   HISTORIAL
===================================================== */

.log {
    margin-top: 34px;
}

.log h2 {
    display: flex;

    align-items: center;

    gap: 14px;

    margin: 0 0 12px;

    font-size: 12px;
    font-weight: 700;

    letter-spacing: .14em;

    text-transform: uppercase;

    color: var(--muted);
}

.log h2::after {
    content: "";

    flex: 1;

    height: 1px;

    background: var(--line);
}

.log-item {
    margin-bottom: 10px;

    padding: 14px 16px;

    background: var(--card);

    border: 1px solid var(--line);

    border-left: 4px solid var(--steel);

    border-radius: var(--radius);

    font-size: 13px;
}

.log-item .row1 {
    display: flex;

    justify-content: space-between;

    align-items: baseline;

    gap: 12px;

    flex-wrap: wrap;
}

.log-item .folio {
    font-family: "IBM Plex Mono", monospace;

    font-weight: 700;

    color: var(--navy);
}

.log-item .date {
    color: var(--muted);

    font-size: 12px;
}

.log-item .meta {
    margin-top: 5px;

    color: var(--muted);
}

.log-item .desc {
    margin-top: 7px;

    color: var(--ink);

    line-height: 1.45;
}

.log-empty {
    margin: 0;

    padding: 22px;

    font-size: 13px;

    font-style: italic;

    color: var(--muted);

    background: white;

    border: 1px solid var(--line);
}

/* =====================================================
   TABLET
===================================================== */

@media (max-width: 850px) {

    body {
        padding: 18px 12px 45px;
    }

    .doc-head {
        grid-template-columns: auto minmax(0, 1fr);

        gap: 18px;

        padding: 20px;
    }

    .logo-box {
        padding-right: 18px;
    }

    /*
       En tablet el folio ocupa toda la siguiente fila,
       por lo que nunca se corta.
    */

    .folio-tab {
        grid-column: 1 / -1;

        width: 100%;

        min-width: 0;

        display: flex;

        align-items: center;

        justify-content: space-between;

        gap: 20px;

        padding: 11px 16px;
    }

    .folio-label {
        margin: 0;
    }

    .folio-num {
        text-align: right;
    }

    form {
        padding: 24px 20px 28px;
    }

    .toast {
        margin-left: 20px;
        margin-right: 20px;
    }

    .type-options {
        grid-template-columns:
            repeat(2, minmax(0, 1fr));
    }
}

/* =====================================================
   MÓVIL
===================================================== */

@media (max-width: 600px) {

    body {
        padding: 12px 8px 35px;
    }

    .doc-head {
        display: flex;

        flex-direction: column;

        align-items: stretch;

        gap: 16px;

        padding: 18px 16px;
    }

    .logo-box {
        justify-content: flex-start;

        width: 100%;

        padding: 0 0 16px;

        border-right: none;

        border-bottom: 1px solid var(--line);
    }

    .company-logo {
        width: 145px;

        max-height: 78px;
    }

    h1 {
        font-size: 24px;
    }

    .sub {
        font-size: 13px;
    }

    /*
        En celular el folio ocupa todo el ancho.
        No existe posibilidad de que quede cortado.
    */

    .folio-tab {
        width: 100%;

        min-width: 0;

        display: flex;

        justify-content: space-between;

        align-items: center;
    }

    .folio-num {
        font-size: 18px;
    }

    form {
        padding: 22px 16px 24px;
    }

    .toast {
        margin: 16px 16px 0;
    }

    .grid2 {
        grid-template-columns: 1fr;

        gap: 0;
    }

    .type-options {
        grid-template-columns: 1fr 1fr;
    }

    .actions {
        flex-direction: column-reverse;
    }

    button,
    .btn-primary,
    .btn-ghost {
        width: 100%;

        min-width: 0;
    }
}

/* =====================================================
   CELULAR PEQUEÑO
===================================================== */

@media (max-width: 380px) {

    .type-options {
        grid-template-columns: 1fr;
    }

    .folio-tab {
        align-items: flex-start;

        flex-direction: column;

        gap: 3px;
    }

    .folio-num {
        text-align: left;
    }
}
</style>
</head>


<body>

<div class="wrap">

    <div class="doc">

        <!-- =============================================
             HEADER
        ============================================== -->

        <header class="doc-head">

            <div class="logo-box">
                <img
                    src="WhatsApp Image 2026-08-14 at 9.55.49 PM.jpeg"
                    alt="Grupo Urvina"
                    class="company-logo"
                >
            </div>

            <div class="head-copy">

                <p class="eyebrow">
                    Sistema de Gestión Integral · Módulo 1
                </p>

                <h1>
                    Solicitud de No Conformidad
                </h1>

                <p class="sub">
                    Registro formal de una no conformidad detectada,
                    para su seguimiento y cierre.
                </p>

            </div>

            <div class="folio-tab">

                <span class="folio-label">
                    Folio
                </span>

                <span
                    class="folio-num"
                    id="folioPreview"
                >
                    NC-…
                </span>

            </div>

        </header>


        <!-- =============================================
             MENSAJE DE ÉXITO
        ============================================== -->

        <div
            class="toast"
            id="toast"
        >
            ✓ Solicitud registrada correctamente.
        </div>


        <!-- =============================================
             FORMULARIO
        ============================================== -->

        <form id="ncForm">

            <div class="grid2">

                <div class="field">

                    <label>
                        <span class="num">01</span>
                        Folio de control
                    </label>

                    <input
                        type="text"
                        id="folioField"
                        disabled
                    >

                    <p class="hint">
                        Se genera automáticamente al guardar.
                    </p>

                </div>


                <div class="field">

                    <label for="fecha">

                        <span class="num">02</span>

                        Fecha de notificación

                        <span class="required-mark">*</span>

                    </label>

                    <input
                        type="date"
                        id="fecha"
                        required
                    >

                </div>

            </div>


            <!-- ÁREA -->

            <div class="field">

                <label for="area">

                    <span class="num">03</span>

                    Área que detecta la No Conformidad

                    <span class="required-mark">*</span>

                </label>

                <select
                    id="area"
                    required
                >

                    <option
                        value=""
                        disabled
                        selected
                    >
                        Selecciona un área…
                    </option>

                </select>

            </div>


            <div class="grid2">

                <!-- NOMBRE -->

                <div class="field">

                    <label for="nombre">

                        <span class="num">04</span>

                        Nombre de quien detecta

                        <span class="required-mark">*</span>

                    </label>

                    <input
                        type="text"
                        id="nombre"
                        placeholder="Nombre completo"
                        required
                    >

                </div>


                <!-- ORIGEN -->

                <div class="field">

                    <label for="origen">

                        <span class="num">05</span>

                        Origen / fuente

                        <span class="required-mark">*</span>

                    </label>

                    <select
                        id="origen"
                        required
                    >

                        <option
                            value=""
                            disabled
                            selected
                        >
                            Selecciona un origen…
                        </option>

                    </select>

                </div>

            </div>


            <!-- TIPO -->

            <div class="field">

                <label>

                    <span class="num">06</span>

                    Tipo de No Conformidad

                    <span class="required-mark">*</span>

                </label>

                <div
                    class="type-options"
                    id="tipoOptions"
                ></div>

            </div>


            <!-- DESCRIPCIÓN -->

            <div class="field">

                <label for="descripcion">

                    <span class="num">07</span>

                    Descripción de la No Conformidad

                    <span class="required-mark">*</span>

                </label>

                <textarea
                    id="descripcion"
                    placeholder="Describe qué ocurrió, dónde, cuándo y su posible impacto…"
                    required
                ></textarea>

            </div>


            <!-- BOTONES -->

            <div class="actions">

                <button
                    type="button"
                    class="btn-ghost"
                    id="resetBtn"
                >
                    Limpiar
                </button>

                <button
                    type="submit"
                    class="btn-primary"
                >
                    Generar solicitud
                </button>

            </div>

        </form>

    </div>


    <!-- =============================================
         HISTORIAL
    ============================================== -->

    <section class="log">

        <h2>
            Solicitudes registradas
        </h2>

        <div id="logList">

            <p class="log-empty">
                Cargando…
            </p>

        </div>

    </section>

</div>


<script>

/* =====================================================
   CATÁLOGOS
===================================================== */

const AREAS = [
    "Dirección General",
    "Sistema de Gestión Integral",
    "Ventas",
    "Asesoría Técnica",
    "Compras",
    "Finanzas",
    "Operaciones",
    "Planeación",
    "Producción",
    "Capital Humano",
    "TI (Tecnologías de la Información)",
    "Seguridad, Higiene y Medio Ambiente",
    "Aseguramiento de la Calidad",
    "Mantenimiento",
    "Operaciones USS",
    "Laboratorio",
    "Seguridad Patrimonial"
];


const ORIGENES = [
    "Auditoría Interna",
    "Auditoría Externa",
    "Queja de Cliente Externo",
    "Queja de Cliente Interno",
    "Requisitos Legales",
    "Revisión por la Dirección",
    "Proveedores",
    "Incumplimiento a los Procesos"
];


const TIPOS = [
    "Producto",
    "Servicio",
    "Proceso",
    "Sistema de Gestión"
];


/* =====================================================
   ELEMENTOS
===================================================== */

const areaSel =
    document.getElementById("area");

const origenSel =
    document.getElementById("origen");

const tipoWrap =
    document.getElementById("tipoOptions");

const folioField =
    document.getElementById("folioField");

const folioPreview =
    document.getElementById("folioPreview");

const form =
    document.getElementById("ncForm");

const toast =
    document.getElementById("toast");


/* =====================================================
   CARGAR ÁREAS
===================================================== */

AREAS.forEach(area => {

    const option =
        document.createElement("option");

    option.value = area;

    option.textContent = area;

    areaSel.appendChild(option);

});


/* =====================================================
   CARGAR ORÍGENES
===================================================== */

ORIGENES.forEach(origen => {

    const option =
        document.createElement("option");

    option.value = origen;

    option.textContent = origen;

    origenSel.appendChild(option);

});


/* =====================================================
   CARGAR TIPOS
===================================================== */

TIPOS.forEach(tipo => {

    const label =
        document.createElement("label");

    label.className = "type-opt";

    label.innerHTML = `
        <input
            type="radio"
            name="tipo"
            value="${tipo}"
            required
        >
        <span>${tipo}</span>
    `;

    tipoWrap.appendChild(label);

});


/* =====================================================
   FECHA ACTUAL
===================================================== */

function setToday() {

    const now = new Date();

    const year =
        now.getFullYear();

    const month =
        String(now.getMonth() + 1)
            .padStart(2, "0");

    const day =
        String(now.getDate())
            .padStart(2, "0");

    document.getElementById("fecha").value =
        `${year}-${month}-${day}`;

}

setToday();


/* =====================================================
   FOLIOS
===================================================== */

function currentYear() {

    return new Date().getFullYear();

}


function getCounter() {

    return parseInt(
        localStorage.getItem("nc:counter") || "0",
        10
    );

}


function peekNextFolio() {

    const next =
        getCounter() + 1;

    return (
        `NC-${currentYear()}-` +
        String(next).padStart(4, "0")
    );

}


function refreshFolioPreview() {

    const folio =
        peekNextFolio();

    folioField.value =
        folio;

    folioPreview.textContent =
        folio;

}


function nextFolio() {

    let counter =
        getCounter();

    counter++;

    localStorage.setItem(
        "nc:counter",
        String(counter)
    );

    return (
        `NC-${currentYear()}-` +
        String(counter).padStart(4, "0")
    );

}


refreshFolioPreview();


/* =====================================================
   SEGURIDAD PARA TEXTO DEL HISTORIAL
===================================================== */

function escapeHTML(text) {

    const div =
        document.createElement("div");

    div.textContent =
        text ?? "";

    return div.innerHTML;

}


/* =====================================================
   CARGAR HISTORIAL
===================================================== */

function loadLog() {

    const listEl =
        document.getElementById("logList");

    let ids = [];

    try {

        ids =
            JSON.parse(
                localStorage.getItem("nc:index") || "[]"
            );

    } catch {

        ids = [];

    }


    if (!ids.length) {

        listEl.innerHTML =
            `<p class="log-empty">
                Aún no hay solicitudes registradas.
            </p>`;

        return;

    }


    const items = [];

    ids
        .slice()
        .reverse()
        .forEach(id => {

            const raw =
                localStorage.getItem(
                    "nc:req:" + id
                );

            if (!raw)
                return;


            try {

                items.push(
                    JSON.parse(raw)
                );

            } catch {}

        });


    if (!items.length) {

        listEl.innerHTML =
            `<p class="log-empty">
                Aún no hay solicitudes registradas.
            </p>`;

        return;

    }


    listEl.innerHTML =
        items.map(item => `

        <article class="log-item">

            <div class="row1">

                <span class="folio">
                    ${escapeHTML(item.folio)}
                </span>

                <span class="date">
                    ${escapeHTML(item.fecha)}
                </span>

            </div>

            <div class="meta">
                ${escapeHTML(item.area)}
                ·
                ${escapeHTML(item.tipo)}
                ·
                ${escapeHTML(item.origen)}
            </div>

            <div class="meta">
                Detectó:
                ${escapeHTML(item.nombre)}
            </div>

            <div class="desc">
                ${escapeHTML(item.descripcion)}
            </div>

        </article>

    `).join("");

}


loadLog();


/* =====================================================
   GUARDAR SOLICITUD
===================================================== */

form.addEventListener(
    "submit",
    function(event) {

        event.preventDefault();


        const tipoInput =
            form.querySelector(
                'input[name="tipo"]:checked'
            );


        if (!tipoInput) {

            alert(
                "Selecciona el tipo de No Conformidad."
            );

            return;

        }


        const submitBtn =
            form.querySelector(
                ".btn-primary"
            );


        submitBtn.disabled =
            true;

        submitBtn.textContent =
            "Guardando…";


        try {

            const folio =
                nextFolio();


            const record = {

                folio,

                fecha:
                    document.getElementById(
                        "fecha"
                    ).value,

                area:
                    areaSel.value,

                nombre:
                    document
                        .getElementById("nombre")
                        .value
                        .trim(),

                origen:
                    origenSel.value,

                tipo:
                    tipoInput.value,

                descripcion:
                    document
                        .getElementById(
                            "descripcion"
                        )
                        .value
                        .trim(),

                creado:
                    new Date().toISOString()

            };


            localStorage.setItem(
                "nc:req:" + folio,
                JSON.stringify(record)
            );


            let ids = [];

            try {

                ids =
                    JSON.parse(
                        localStorage.getItem(
                            "nc:index"
                        ) || "[]"
                    );

            } catch {

                ids = [];

            }


            ids.push(folio);


            localStorage.setItem(
                "nc:index",
                JSON.stringify(ids)
            );


            toast.textContent =
                `✓ Solicitud ${folio} registrada correctamente.`;


            toast.classList.add(
                "show"
            );


            setTimeout(() => {

                toast.classList.remove(
                    "show"
                );

            }, 4000);


            form.reset();

            setToday();

            refreshFolioPreview();

            loadLog();


        } catch (error) {

            console.error(error);

            alert(
                "Ocurrió un error al guardar la solicitud."
            );

        } finally {

            submitBtn.disabled =
                false;

            submitBtn.textContent =
                "Generar solicitud";

        }

    }
);


/* =====================================================
   LIMPIAR
===================================================== */

document
    .getElementById("resetBtn")
    .addEventListener(
        "click",
        function() {

            form.reset();

            setToday();

        }
    );

</script>

</body>
</html>
